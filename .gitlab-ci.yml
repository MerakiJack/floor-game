# GitLab CI: test -> build -> deploy to Vercel.
# Deploy jobs need these CI/CD variables (Settings > CI/CD > Variables, masked):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# If the repository is already connected to Vercel through its Git integration,
# leave them unset — the deploy jobs are skipped and Vercel deploys on its own.
image: node:22

stages: [test, build, deploy]

default:
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline

test:
  stage: test
  script:
    - npm test

build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths: [dist/]
    expire_in: 1 week

.vercel:
  stage: deploy
  needs: [test, build]
  variables:
    VERCEL_CLI: "vercel@latest"

deploy_preview:
  extends: .vercel
  rules:
    - if: '$VERCEL_TOKEN && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
  environment:
    name: preview/$CI_COMMIT_REF_SLUG
  script:
    - npx $VERCEL_CLI pull --yes --environment=preview --token=$VERCEL_TOKEN
    - npx $VERCEL_CLI build --token=$VERCEL_TOKEN
    - npx $VERCEL_CLI deploy --prebuilt --token=$VERCEL_TOKEN

deploy_production:
  extends: .vercel
  rules:
    - if: '$VERCEL_TOKEN && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  environment:
    name: production
  script:
    - npx $VERCEL_CLI pull --yes --environment=production --token=$VERCEL_TOKEN
    - npx $VERCEL_CLI build --prod --token=$VERCEL_TOKEN
    - npx $VERCEL_CLI deploy --prebuilt --prod --token=$VERCEL_TOKEN
